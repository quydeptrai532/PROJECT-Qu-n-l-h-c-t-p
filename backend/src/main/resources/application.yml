server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: quan-ly-dao-tao
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/quan_ly_dao_tao?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: ${SUPPORT_MAX_FILE_SIZE:5MB}
      max-request-size: ${SUPPORT_MAX_REQUEST_SIZE:16MB}

app:
  support-request:
    # Cấu hình tập trung tạm thời cho phiếu hỗ trợ/khiếu nại sinh viên (cần chủ dự án xác nhận danh mục/chính sách tệp/SLA chính thức).
    storage-dir: ${SUPPORT_UPLOAD_DIR:./data/support-attachments}
    max-file-size-bytes: ${SUPPORT_MAX_FILE_SIZE_BYTES:5242880}
    max-files-per-request: ${SUPPORT_MAX_FILES_PER_REQUEST:3}
    allowed-extensions: ${SUPPORT_ALLOWED_EXTENSIONS:pdf,png,jpg,jpeg}
    allowed-types: ${SUPPORT_ALLOWED_TYPES:HOC_PHAN,DIEM_SO,HOC_KY,HO_SO_HOC_VU,KHAC}
    allowed-statuses: ${SUPPORT_ALLOWED_STATUSES:MOI_TAO,DANG_XU_LY,CHO_PHAN_HOI_SINH_VIEN,DA_GIAI_QUYET,TU_CHOI,DA_DONG}
    comment-allowed-statuses: ${SUPPORT_COMMENT_ALLOWED_STATUSES:MOI_TAO,DANG_XU_LY,CHO_PHAN_HOI_SINH_VIEN,DA_GIAI_QUYET}
    # Không tuyên bố SLA chính thức khi chưa có quyết định của chủ dự án.
    sla-note: ${SUPPORT_SLA_NOTE:}
  dashboard:
    # Học kỳ/đợt đăng ký được xem là "sắp tới" trong vòng 14 ngày; chỉnh tại cấu hình này.
    upcoming-window-days: ${DASHBOARD_UPCOMING_WINDOW_DAYS:14}
  jwt:
    secret: ${JWT_SECRET:day-la-khoa-bi-mat-cho-he-thong-quan-ly-dao-tao-phai-du-32-byte}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}
  seed:
    enabled: ${SEED_ENABLED:true}
  export:
    danh-sach-lop:
      cho-phep-email: ${EXPORT_CHO_PHEP_EMAIL:true}
    bang-diem:
      # Tên đơn vị phát hành chính thức; để trống nếu chưa cấu hình mẫu chính thức.
      don-vi-phat-hanh: ${EXPORT_BANG_DIEM_DON_VI_PHAT_HANH:}
